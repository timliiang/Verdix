spring.application.name=Verdix
# DB_HOST/DB_PORT default to the local Docker Postgres; a container sets DB_HOST=db instead
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.config.import=optional:file:.env[.properties]

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:900000}

tmdb.read.access.token=${TMDB_READ_ACCESS_TOKEN}
tmdb.base.url=${TMDB_BASE_URL}
